<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110">
  <defs>
    <linearGradient id="samaSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56CCF2" />
      <stop offset="50%" stop-color="#2997D8" />
      <stop offset="100%" stop-color="#1A6FA8" />
    </linearGradient>
    <linearGradient id="samaSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <!-- Soft Sky Circle Badge -->
  <circle cx="55" cy="55" r="44" fill="url(#samaSoft)" stroke="url(#samaSky)" stroke-width="2.5"/>

  <!-- Cloud & Steam Waves -->
  <path d="M43 36 C43 29, 51 29, 51 22" fill="none" stroke="url(#samaSky)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M55 38 C55 30, 63 30, 63 21" fill="none" stroke="url(#samaSky)" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M67 36 C67 29, 73 29, 73 23" fill="none" stroke="url(#samaSky)" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Minimalist Specialty Coffee Cup -->
  <path d="M35 44 H75 V58 C75 70, 66 78, 55 78 C44 78, 35 70, 35 58 Z" fill="url(#samaSky)"/>
  <!-- Cup Handle -->
  <path d="M75 48 H80 C84 48, 87 51, 87 55 C87 59, 84 62, 80 62 H74" fill="none" stroke="url(#samaSky)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Sky Wave inside Cup -->
  <path d="M39 58 Q47 53, 55 58 T71 58" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Saucer -->
  <path d="M32 83 H78" stroke="url(#samaSky)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Brand Typography: SAMA | سما -->
  <text x="115" y="54" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#0F2942" letter-spacing="3">SAMA</text>
  <text x="235" y="54" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="34" font-weight="800" fill="#2997D8">سما</text>
  <text x="115" y="79" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#52718C" letter-spacing="1.5">SPECIALTY COFFEE • قهوة مختصة</text>
</svg>
